<mat-card [routerLink]="['/teams', team.id]" class="team-card">

  <button
    class="favorite-btn"
    mat-icon-button
    type="button"
    [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    (click)="toggleFavorite($event)">

    <mat-icon [class.favorite-active]="isFavorite">
      {{ isFavorite ? 'star' : 'star_border' }}
    </mat-icon>
  </button>

  <img
      mat-card-image
      [src]="team.logo"
      [alt]="team.name">

  <mat-card-content>

      <h2>{{ team.name }}</h2>

      <p>{{ team.city }}</p>

      <p>{{ team.conference }}</p>

      <p>{{ team.division }}</p>

  </mat-card-content>

</mat-card>
